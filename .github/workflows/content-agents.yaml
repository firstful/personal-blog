name: Content Agents

on:
  schedule:
    # 9am, 1pm, 5pm, 9pm Eastern (EDT = UTC-4, EST = UTC-5 in winter)
    - cron: "0 14,18,22,2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@latest

      - name: Install Python deps
        run: pip install --quiet -r content-agents/requirements.txt

      - name: Validate CUE data
        run: |
          cue vet ./...

      - name: Generate articles
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: deepseek-v4-flash
          LLM_BASE_URL: https://api.deepseek.com/v1
          BLOG_BASE_DIR: ${{ github.workspace }}
          NUM_THREADS: 2
          MAX_POSTS_PER_THREAD: 6
          MIN_POSTS_PER_THREAD: 3
        run: |
          python3 content-agents/run.py generate 2>&1

      - name: Create PR with changes
        run: |
          git config user.name "Content Agent"
          git config user.email "bot@ffilt.us"
          git add cue/opinions/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            BRANCH="content-agents/$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "content-agents: auto-generated CUE articles"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "content-agents: auto-generated articles $(date +%Y-%m-%d)" \
              --body "Automated content generation from content-agents pipeline." \
              --base main \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
