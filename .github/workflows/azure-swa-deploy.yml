name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  test_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@latest

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Build site
        run: npm run build

      - name: Copy SWA config
        run: cp staticwebapp.config.json site/staticwebapp.config.json

      - name: Serve site
        run: |
          npx swa start site --port 8000 --app-location site --api-location "" &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000 2>/dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: BASE_URL=http://localhost:8000 npx playwright test

      - name: Enable auto-merge
        if: success()
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build, Test, Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@latest

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Build site
        run: npm run build

      - name: Copy SWA config
        run: cp staticwebapp.config.json site/staticwebapp.config.json

      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Deploy to staging
        id: staging
        run: |
          OUTPUT=$(swa deploy site \
            --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_POND_0F39DCB0F }} \
            --env staging 2>&1)
          echo "$OUTPUT"
          STAGING_URL=$(echo "$OUTPUT" | grep -oP 'https://[a-z0-9\-\.]+\.azurestaticapps\.net' | head -1)
          if [ -z "$STAGING_URL" ]; then
            echo "Failed to extract staging URL from deploy output"
            exit 1
          fi
          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $STAGING_URL"

      - name: Wait for staging to be healthy
        run: |
          URL="${{ steps.staging.outputs.url }}"
          echo "Waiting for $URL to be healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Staging is healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "Staging did not become healthy in time"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests against staging
        run: BASE_URL="${{ steps.staging.outputs.url }}" npx playwright test

      - name: Deploy to production
        run: |
          swa deploy site \
            --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_POND_0F39DCB0F }} \
            --env production
