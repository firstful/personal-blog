name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  test_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Validate structure
        run: |
          test -f index.html
          test -f assets/style.css
          test -f assets/app.js
          test -f api/package.json
          echo "Structure OK"

      - name: Enable auto-merge
        if: success()
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli

      # SECURITY: never publish the checkout itself.
      # Deploying $GITHUB_WORKSPACE published /.git/ (including the live CI
      # GITHUB_TOKEN in .git/config), /resume/ (personal resume + job
      # application data), /AGENTS.md, /README.md and /.mailmap to the public
      # internet. stage-public.sh builds a clean allow-listed artifact.
      - name: Stage public artifact
        run: bash scripts/stage-public.sh "${{ runner.temp }}/publish"

      - name: Verify no sensitive paths in staged artifact
        run: |
          set -e
          STAGED="${{ runner.temp }}/publish"
          for bad in .git resume AGENTS.md README.md .mailmap .github .gitea; do
            if [ -e "$STAGED/site/$bad" ]; then
              echo "FATAL: $bad leaked into the staged static artifact" >&2
              exit 1
            fi
          done
          if [ -e "$STAGED/api/local.settings.json" ]; then
            echo "FATAL: local.settings.json leaked into the staged functions app" >&2
            exit 1
          fi
          echo "Staged artifact is clean."

      - name: Deploy to staging
        id: staging
        # The SWA CLI refuses to run when the CURRENT DIRECTORY is identical to
        # or contained within an artifact folder:
        #   "Current directory cannot be identical to or contained within artifact folders."
        # With api_location inside the repo root (the default checkout layout)
        # that check trips, so run from runner.temp and pass absolute paths.
        working-directory: ${{ runner.temp }}
        run: |
          OUTPUT=$(swa deploy "${{ runner.temp }}/publish/site" \
            --api-location "${{ runner.temp }}/publish/api" \
            --api-language node \
            --api-version 20 \
            --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SUTLIFF_DASHBOARD }} \
            --env staging 2>&1)
          echo "$OUTPUT"
          STAGING_URL=$(echo "$OUTPUT" | grep -oP 'https://[a-z0-9\-\.]+\.azurestaticapps\.net' | head -1)
          if [ -z "$STAGING_URL" ]; then
            echo "Failed to extract staging URL from deploy output"
            exit 1
          fi
          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $STAGING_URL"

      - name: Wait for staging to be healthy
        run: |
          URL="${{ steps.staging.outputs.url }}"
          echo "Waiting for $URL to be healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Staging is healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "Staging did not become healthy in time"
          exit 1

      - name: Deploy to production
        working-directory: ${{ runner.temp }}
        run: |
          swa deploy "${{ runner.temp }}/publish/site" \
            --api-location "${{ runner.temp }}/publish/api" \
            --api-language node \
            --api-version 20 \
            --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SUTLIFF_DASHBOARD }} \
            --env production
