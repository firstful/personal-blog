name: build-site

# Build the static site image (mkdocs build inside Containerfile) and push to
# the Gitea registry (:latest + :sha8). Deploy = bump tag in reeds/sutliff-cluster.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: reeds/ci-pipelines/.gitea/workflows/build-python.yml@main
    with:
      image: reeds/personal-blog
      dockerfile: Containerfile
    secrets: inherit
