site_name: Sutliff
site_url: https://ffilt.us/
extra:
  tags:
    UiPath : uipath
    Engineering : eng
    C# : c-sharp
    Azure Pipelines: azure-pipelines
    Github Actions: github-actions
    AsyncAPI : asyncapi
    OpenAPI : openapi
    Azure Functions : azure-functions
    Azure : azure
    MkDocs: mkdocs
    Tutorial: tutorial
    JSON: json
    Python: python
    TypeScript: typescript
  social:
    - icon: material/email-fast
      link: mailto:reed@ffilt.us
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/reed-sutliff-21213b114/
    - icon: fontawesome/brands/github
      link: https://github.com/reedsutliff
    - icon: fontawesome/solid/rss
      link: /feed_rss_created.xml
    - icon: simple/medium
      link: https://sutliff.medium.com/
theme:
  name: material
  custom_dir: theme/
  logo: assets/logo.png
  icon:
    tag:
      uipath : custom/uipath
      eng : material/laptop
      asyncapi : custom/asyncapi
      python : simple/python
      c-sharp : simple/csharp
      azure-pipelines: simple/azurepipelines
      github-actions: simple/githubactions
      json: simple/json
      tutorial: material/directions
      azure-functions: custom/azure-functions
      azure: custom/azure
      openapi : custom/openapi
      mkdocs : custom/mkdocs
      typescript : simple/typescript
    repo: fontawesome/brands/git-alt 
  favicon: assets/logo.png
  font:
    text: Inter
  features:
    - content.code.copy
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - toc.follow
  palette:
    - scheme: default
      logo: assets/logo.svg
plugins:
  macros: {}
  tags: 
    tags_file: tags.md
  blogging:
    template: docs/assets/custom-blog.html
    features:
      tags: {}
    dirs:
      - blog
  search : {}
  git-authors:
    fallback_to_empty: false
    exclude:
      - /*/_*.md
    enabled: !ENV [MKDOCS_ENABLE_GIT_INFO, false]
  git-revision-date-localized:
      fallback_to_build_date: true
      enabled: !ENV [MKDOCS_ENABLE_GIT_INFO, false]
  exclude-search:
      exclude:
        - /*/_*.md
  include-markdown : {}
  kroki:
    FencePrefix: 'kroki-'
    EnableBlockDiag: true
    EnableMermaid: true
    HttpMethod: 'POST'
    DownloadImages: true
  rss:
    match_path: "blog(\\\\|/).+\\.md"
    enabled: !ENV [MKDOCS_ENABLE_RSS, True]
    pretty_print: false
  literate-nav:
    nav_file: _nav.md
    implicit_index: true
extra_css:
  - assets/theme.css
markdown_extensions:
  toc : {}
  footnotes : {}
  meta : {}
  admonition : {}
  pymdownx.details : {}
  pymdownx.highlight:
    anchor_linenums: true
  pymdownx.inlinehilite : {}
  pymdownx.snippets : {}
  pymdownx.tabbed: 
    alternate_style: true 
  attr_list : {}
  def_list : {}
  pymdownx.emoji:
    emoji_index: !!python/name:materialx.emoji.twemoji
    emoji_generator: !!python/name:materialx.emoji.to_svg
    options:
      custom_icons:
        - theme/.icons
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format