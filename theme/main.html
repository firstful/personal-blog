{% extends "base.html" %}

{% block scripts %}
  {{ super() }}
  <script>
    (function() {
      var html = document.documentElement;

      var observer = new MutationObserver(function() {
        var raf = requestAnimationFrame(function() {
          html.classList.add('color-transition');
          setTimeout(function() {
            html.classList.remove('color-transition');
          }, 350);
        });
        confettiBurst();
      });

      observer.observe(html, {
        attributes: true,
        attributeFilter: ['data-md-color-scheme']
      });

      var bar = document.createElement('div');
      bar.id = 'read-progress';
      document.body.prepend(bar);

      function updateProgress() {
        var scrollTop = window.scrollY;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (docHeight > 100) {
          var pct = Math.min(scrollTop / docHeight * 100, 100);
          bar.style.width = pct + '%';
        }
      }

      window.addEventListener('scroll', updateProgress);
      window.addEventListener('resize', updateProgress);

      function confettiBurst() {
        var count = 60;
        var colors = ['#b8895a', '#c4b094', '#dbbc8c', '#e8dfd0', '#e8d5b5', '#f0e0c8', '#7a6b50', '#c4956a'];
        var container = document.createElement('div');
        container.style.cssText = [
          'position: fixed; top: 0; left: 0; width: 100%; height: 100%;',
          'pointer-events: none; z-index: 9998; overflow: hidden;'
        ].join('');
        document.body.appendChild(container);

        for (var i = 0; i < count; i++) {
          var piece = document.createElement('div');
          var color = colors[Math.floor(Math.random() * colors.length)];
          var size = Math.random() * 8 + 4;
          var startX = Math.random() * 100;
          var delay = Math.random() * 0.3;
          var duration = Math.random() * 1.5 + 1;
          var shapes = ['50%', '0%'];
          var br = shapes[Math.floor(Math.random() * shapes.length)];

          piece.style.cssText = [
            'position: absolute;',
            'top: 45%;',
            'left: ' + startX + '%;',
            'width: ' + size + 'px;',
            'height: ' + (size * (Math.random() * 0.6 + 0.6)) + 'px;',
            'background: ' + color + ';',
            'border-radius: ' + br + ';',
            'animation: confetti-drop ' + duration + 's ease-out ' + delay + 's forwards;',
            'transform: rotate(' + (Math.random() * 360) + 'deg);',
            'opacity: 0;',
          ].join('');
          container.appendChild(piece);
        }

        setTimeout(function() {
          if (container.parentNode) container.parentNode.removeChild(container);
        }, 3500);
      }

      document.addEventListener('click', function(e) {
        var ripple = document.createElement('div');
        ripple.className = 'click-ripple';
        var x = e.clientX - 60;
        var y = e.clientY - 60;
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        document.body.appendChild(ripple);
        ripple.addEventListener('animationend', function() {
          ripple.remove();
        });
      });

      setTimeout(function() {
        var styles = [
          'color: #bea88b',
          'font-size: 16px',
          'font-weight: bold',
          'padding: 8px',
        ].join(';');

        console.log('%c  sutliff  ', styles);
        console.log('%cHey, thanks for peeking under the hood!', 'color: #a38256; font-size: 13px;');
        console.log(
          '%cThis site is built with MkDocs + Material. The source is at github.com/reedsutliff',
          'color: #888; font-size: 11px;'
        );
      }, 100);
    })();
  </script>
{% endblock %}
