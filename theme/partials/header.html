<header class="md-header" data-md-component="header" style="display:none"></header>

<nav class="bbs-menu" role="navigation" aria-label="Site Menu">
  <div class="bbs-menu-inner">
    <a class="bbs-brand" href="{{ base_url | default('.') }}/">SUTLIFF BBS</a>

    <div class="bbs-search">
      {% include "partials/search.html" %}
    </div>

    <a class="bbs-about" href="{{ base_url | default('.') }}/resume/">
      <span class="menu-key">A</span> About
    </a>
  </div>
</nav>
